<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle UI - Seia</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        :root {
            --cut: 16px;
            --hud-clip: polygon(
                var(--cut) 0, 100% 0,
                100% calc(100% - var(--cut)),
                calc(100% - var(--cut)) 100%,
                0 100%, 0 var(--cut)
            );
        }

        /* --- HUD panels: cut corners, 2px accent border, shape-following glow --- */
        .hud {
            padding: 2px;
            clip-path: var(--hud-clip);
            background: linear-gradient(135deg, var(--edge-a), var(--edge-b));
        }
        .hud-body {
            clip-path: var(--hud-clip);
            background: linear-gradient(160deg, #14181f 0%, #0b0e13 100%);
        }
        .hud-enemy {
            --edge-a: #f87171;
            --edge-b: #7f1d1d;
            filter: drop-shadow(0 0 22px rgba(239, 68, 68, 0.35));
        }
        .hud-player {
            --edge-a: #60a5fa;
            --edge-b: #1e3a8a;
            filter: drop-shadow(0 0 22px rgba(37, 99, 235, 0.35));
        }

        /* --- Bars --- */
        .bar {
            position: relative;
            overflow: hidden;
            background: #05070a;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.9);
        }
        .bar-fill,
        .bar-ghost {
            position: absolute;
            inset: 0 auto 0 0;
            height: 100%;
        }
        .bar-fill {
            z-index: 2;
            transition: width 380ms cubic-bezier(0.22, 1, 0.36, 1);
        }
        /* Ghost trail: lingers at the old value, then drains behind the fill. */
        .bar-ghost {
            z-index: 1;
            background: rgba(255, 255, 255, 0.85);
            transition: width 700ms ease 260ms;
        }
        /* Segment ticks, drawn over the fill. */
        .bar-ticks {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: repeating-linear-gradient(
                90deg,
                transparent 0 9px,
                rgba(0, 0, 0, 0.55) 9px 11px
            );
        }
        .bar-hp .bar-fill {
            background: linear-gradient(90deg, #b91c1c, #f87171 60%, #fca5a5);
        }
        .bar-mp .bar-fill {
            background: linear-gradient(90deg, #1d4ed8, #3b82f6 60%, #93c5fd);
        }
        /* Low-HP warning: the fill itself pulses. */
        .bar-hp.is-critical .bar-fill {
            animation: critical 900ms ease-in-out infinite;
        }
        @keyframes critical {
            50% { filter: brightness(1.7) saturate(1.4); }
        }

        /* --- Hit feedback --- */
        .hud.is-hit, .arena.is-hit { animation: shake 320ms ease; }
        .hud.is-hit .hud-body { animation: flash 320ms ease; }
        @keyframes shake {
            20% { transform: translate(-7px, 3px); }
            40% { transform: translate(6px, -3px); }
            60% { transform: translate(-4px, 2px); }
            80% { transform: translate(3px, -1px); }
        }
        @keyframes flash {
            0%, 100% { filter: none; }
            25% { filter: brightness(2.4) saturate(0.2) sepia(1) hue-rotate(-40deg); }
        }

        /* --- Floating damage numbers --- */
        .fx {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .float-num {
            position: absolute;
            left: 50%;
            top: 42%;
            font-weight: 900;
            font-size: 2.25rem;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 0 #000, 0 0 18px currentColor;
            animation: float-up 1100ms cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }
        .float-num.dmg { color: #fca5a5; }
        .float-num.heal { color: #86efac; }
        .float-num.miss { color: #cbd5e1; font-size: 1.5rem; }
        @keyframes float-up {
            0% { opacity: 0; transform: translate(-50%, 10px) scale(0.6); }
            18% { opacity: 1; transform: translate(-50%, -6px) scale(1.25); }
            35% { transform: translate(-50%, -14px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -62px) scale(1); }
        }

        .narrator-line { animation: rise 260ms ease; }
        @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
        }

        /* Bars and numbers share one tabular grid so values don't jitter. */
        .num { font-variant-numeric: tabular-nums; }

        /* Blend the goblin photo's grey background into the panel. */
        #enemy-art {
            -webkit-mask-image: radial-gradient(circle at center, #000 58%, transparent 100%);
            mask-image: radial-gradient(circle at center, #000 58%, transparent 100%);
        }

        @media (prefers-reduced-motion: reduce) {
            .hud.is-hit,
            .hud.is-hit .hud-body,
            .bar-hp.is-critical .bar-fill,
            .float-num,
            .narrator-line {
                animation: none !important;
            }
        }
    </style>
</head>
<body class="bg-linear-to-br from-gray-900 to-black text-white min-h-screen flex flex-col items-center p-4 sm:p-6">

    <div class="w-full max-w-3xl relative">
        <div class="arena flex flex-col gap-4" id="arena">

            <!-- ============ ENEMY ============ -->
            <section class="hud hud-enemy" id="enemy-panel" aria-labelledby="enemy-name">
                <div class="hud-body p-4 sm:p-5 relative">
                    <div class="fx" id="enemy-fx"></div>

                    <header class="flex items-end justify-between gap-4">
                        <div class="min-w-0">
                            <p class="text-[0.65rem] font-bold uppercase tracking-[0.3em] text-red-400/80">Enemy</p>
                            <h2 id="enemy-name" class="text-xl font-black uppercase tracking-widest text-red-100 truncate">Goblin</h2>
                        </div>
                        <p class="num shrink-0 text-right leading-none">
                            <span class="text-2xl font-black text-red-300" id="enemy-hp-now">90</span>
                            <span class="text-sm font-bold text-red-300/40">/90</span>
                        </p>
                    </header>

                    <div class="bar bar-hp mt-3 h-3.5"
                         role="progressbar" aria-label="Goblin health"
                         aria-valuemin="0" aria-valuemax="90" aria-valuenow="90" id="enemy-bar">
                        <div class="bar-ghost" id="enemy-ghost" style="width:100%"></div>
                        <div class="bar-fill" id="enemy-fill" style="width:100%"></div>
                        <div class="bar-ticks"></div>
                    </div>

                    <div class="mt-4 flex justify-center">
                        <img src="https://i.pinimg.com/736x/8d/1a/5b/8d1a5b3eaaa6517de4d8c8a0549a9bd8.jpg"
                             alt="A goblin, snarling"
                             id="enemy-art"
                             class="h-40 w-40 sm:h-48 sm:w-48 object-cover rounded-lg ring-1 ring-red-500/30">
                    </div>
                </div>
            </section>

            <!-- ============ NARRATOR + LOG ============ -->
            <section class="px-1">
                <p class="narrator-line text-lg sm:text-xl font-semibold text-indigo-100 min-h-7"
                   id="narrator" aria-live="polite" role="status">A goblin blocks your path!</p>
                <ul class="mt-2 space-y-0.5 text-xs text-gray-500" id="log" aria-label="Battle log"></ul>
            </section>

            <!-- ============ PLAYER ============ -->
            <section class="hud hud-player" id="player-panel" aria-labelledby="player-name">
                <div class="hud-body p-4 sm:p-5 relative">
                    <div class="fx" id="player-fx"></div>

                    <div class="flex items-center gap-4">
                        <img src="https://i.pinimg.com/736x/2d/dc/f1/2ddcf18b5f7cba39e4d80cc7aca9fb41.jpg"
                             alt="Seia, a swordswoman"
                             id="player-art"
                             class="h-16 w-16 sm:h-20 sm:w-20 shrink-0 object-cover rounded-md ring-1 ring-blue-400/40 shadow-[0_0_18px_rgba(37,99,235,0.4)]">

                        <div class="min-w-0 flex-1">
                            <header class="flex items-end justify-between gap-3">
                                <div class="min-w-0">
                                    <p class="text-[0.65rem] font-bold uppercase tracking-[0.3em] text-blue-400/80">Player</p>
                                    <h2 id="player-name" class="text-xl font-black uppercase tracking-widest text-blue-100 truncate">Seia</h2>
                                </div>
                                <dl class="num shrink-0 flex gap-4 text-right leading-none">
                                    <div>
                                        <dt class="text-[0.6rem] font-bold uppercase tracking-widest text-gray-500">HP</dt>
                                        <dd class="mt-0.5">
                                            <span class="text-2xl font-black text-green-300" id="player-hp-now">100</span>
                                            <span class="text-sm font-bold text-green-300/40">/100</span>
                                        </dd>
                                    </div>
                                    <div>
                                        <dt class="text-[0.6rem] font-bold uppercase tracking-widest text-gray-500">MP</dt>
                                        <dd class="mt-0.5">
                                            <span class="text-2xl font-black text-blue-300" id="player-mp-now">50</span>
                                            <span class="text-sm font-bold text-blue-300/40">/50</span>
                                        </dd>
                                    </div>
                                </dl>
                            </header>

                            <div class="mt-3 space-y-2">
                                <div class="bar bar-hp h-3.5"
                                     role="progressbar" aria-label="Seia's health"
                                     aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="player-bar">
                                    <div class="bar-ghost" id="player-ghost" style="width:100%"></div>
                                    <div class="bar-fill" id="player-fill" style="width:100%"></div>
                                    <div class="bar-ticks"></div>
                                </div>
                                <div class="bar bar-mp h-2.5"
                                     role="progressbar" aria-label="Seia's magic points"
                                     aria-valuemin="0" aria-valuemax="50" aria-valuenow="50" id="player-mp-bar">
                                    <div class="bar-fill" id="player-mp-fill" style="width:100%"></div>
                                    <div class="bar-ticks"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ============ COMMANDS ============ -->
            <section class="grid grid-cols-2 md:grid-cols-4 gap-3" id="commands" aria-label="Choose your action">
                <button type="button" data-action="attack"
                        class="cmd group relative overflow-hidden px-4 py-3 font-black uppercase tracking-widest text-sm bg-slate-800 ring-1 ring-slate-600 hover:bg-indigo-600 hover:ring-indigo-400 transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-indigo-400 focus-visible:ring-offset-2 focus-visible:ring-offset-black disabled:opacity-35 disabled:cursor-not-allowed disabled:hover:bg-slate-800 disabled:hover:ring-slate-600">
                    <span aria-hidden="true">⚔</span> Attack
                </button>

                <button type="button" data-action="magic"
                        class="cmd group relative overflow-hidden px-4 py-3 font-black uppercase tracking-widest text-sm bg-slate-800 ring-1 ring-slate-600 hover:bg-blue-600 hover:ring-blue-400 transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-blue-400 focus-visible:ring-offset-2 focus-visible:ring-offset-black disabled:opacity-35 disabled:cursor-not-allowed disabled:hover:bg-slate-800 disabled:hover:ring-slate-600">
                    <span aria-hidden="true">✨</span> Magic
                    <span class="block text-[0.6rem] font-bold tracking-wider opacity-60 num" id="magic-cost">10 MP</span>
                </button>

                <button type="button" data-action="item"
                        class="cmd group relative overflow-hidden px-4 py-3 font-black uppercase tracking-widest text-sm bg-slate-800 ring-1 ring-slate-600 hover:bg-green-600 hover:ring-green-400 transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-green-400 focus-visible:ring-offset-2 focus-visible:ring-offset-black disabled:opacity-35 disabled:cursor-not-allowed disabled:hover:bg-slate-800 disabled:hover:ring-slate-600">
                    <span aria-hidden="true">💊</span> Item
                    <span class="block text-[0.6rem] font-bold tracking-wider opacity-60 num" id="potion-count">×3 left</span>
                </button>

                <button type="button" data-action="run"
                        class="cmd group relative overflow-hidden px-4 py-3 font-black uppercase tracking-widest text-sm bg-slate-800 ring-1 ring-slate-600 hover:bg-red-600 hover:ring-red-400 transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-red-400 focus-visible:ring-offset-2 focus-visible:ring-offset-black disabled:opacity-35 disabled:cursor-not-allowed disabled:hover:bg-slate-800 disabled:hover:ring-slate-600">
                    <span aria-hidden="true">🏃</span> Run
                </button>
            </section>
        </div>

        <!-- ============ END-OF-BATTLE OVERLAY ============ -->
        <div class="absolute inset-0 z-10 hidden items-center justify-center bg-black/80 backdrop-blur-sm" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
            <div class="text-center px-6">
                <h2 class="text-4xl sm:text-5xl font-black uppercase tracking-[0.2em]" id="overlay-title">Victory</h2>
                <p class="mt-3 text-sm text-gray-400" id="overlay-sub"></p>
                <button type="button" id="restart"
                        class="mt-8 px-8 py-3 font-black uppercase tracking-widest text-sm bg-indigo-600 ring-1 ring-indigo-400 hover:bg-indigo-500 transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-indigo-300 focus-visible:ring-offset-2 focus-visible:ring-offset-black">
                    Fight Again
                </button>
            </div>
        </div>
    </div>

    <footer class="mt-10 text-gray-500 text-sm">&copy; 2026 Seia Battle UI</footer>

    <script src="src/battle.js" defer></script>
</body>
</html>
